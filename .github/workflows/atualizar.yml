name: Atualizar índices

# Horários oficiais: 09:00 e 19:00 em America/Maceio (UTC−03:00, sem horário de verão).
# O cron do GitHub Actions é sempre UTC => 12:00 e 22:00 UTC.
# As linhas :45 são execuções de RESERVA: o GitHub pode atrasar ou descartar execuções agendadas.
# Toda execução automática (principal ou reserva) é ignorada se outra terminou nas últimas 2 horas SEM falhas;
# se houve falha em algum índice, ele é tentado novamente. Assim não há coleta duplicada nem falha sem nova tentativa.
on:
  schedule:
    - cron: "0 12,22 * * *"
    - cron: "45 12,22 * * *"
  workflow_dispatch:
    inputs:
      indice:
        description: "Índice a atualizar (vazio = todos)"
        type: choice
        options: ["", ipca, icti, ist]
        default: ""
      simulacao:
        description: "Somente testar as fontes, sem gravar nada"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: atualizar-indices          # nunca duas atualizações ao mesmo tempo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write                  # grava dados e logs (commit do robô)
    outputs:
      resultado: ${{ steps.rodar.outputs.resultado }}
      gravacao: ${{ steps.gravar.outcome }}
      inicio: ${{ steps.inicio.outputs.instante }}
    steps:
      - id: inicio
        run: echo "instante=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: rodar
        env:
          PYTHONPATH: src
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INDICE: ${{ inputs.indice }}
          SIMULACAO: ${{ inputs.simulacao }}
        run: |
          set +e
          args=(atualizar)
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            args+=(--gatilho manual)
            [ -n "$INDICE" ] && args+=(--indice "$INDICE")
            [ "$SIMULACAO" = "true" ] && args+=(--dry-run)
          elif [[ "$CRON" == 45* ]]; then
            args+=(--gatilho reserva --pular-se-recente 120)
          else
            args+=(--gatilho agendado --pular-se-recente 120)
          fi
          python -m indices "${args[@]}"
          echo "resultado=$?" >> "$GITHUB_OUTPUT"
          exit 0   # a falha de um índice é registrada nos logs; o commit e a publicação seguem
      - name: Gravar dados e logs no repositório
        id: gravar
        run: |
          git config user.name  "indices-bot"
          git config user.email "indices-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nada a gravar"
            exit 0
          fi
          git commit -m "dados: atualização automática $(TZ=America/Maceio date '+%d/%m/%Y %H:%M')"
          enviado=0
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              enviado=1; break
            fi
            sleep 5
          done
          if [ "$enviado" != "1" ]; then
            echo "::error::Não foi possível enviar o commit de dados ao repositório após 3 tentativas."
            exit 1
          fi
      - name: Falhar o job se algum índice falhou (o job de monitoramento roda mesmo assim e abre o alerta)
        if: steps.rodar.outputs.resultado != '0'
        run: |
          echo "::error::Ao menos um índice falhou na coleta. Veja o resumo da execução, data/logs e a aba Registros do site."
          exit 1

  publicar:
    needs: atualizar
    if: ${{ !cancelled() && inputs.simulacao != true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:                           # um deploy por vez; o mais recente sempre vence
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}      # ponta da branch: inclui o commit de dados do job anterior
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true       # a v4+ omite arquivos iniciados por ponto (.nojekyll) por padrão
      - id: deploy
        uses: actions/deploy-pages@v5

  monitorar:
    # Alertas por e-mail (issue + menção) e sinal de vida externo opcional. Roda sempre, exceto em cancelamentos
    # e simulações, e nunca altera dados.
    needs: [atualizar, publicar]
    if: ${{ always() && inputs.simulacao != true && needs.atualizar.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: alertas
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}      # opcional: ver docs/MONITORAMENTO.md
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Abrir, atualizar ou fechar alertas
        run: >
          python -m indices alertas execucao
          --atualizar "${{ needs.atualizar.result }}"
          --publicar "${{ needs.publicar.result }}"
          --coleta "${{ needs.atualizar.outputs.resultado }}"
          --gravacao "${{ needs.atualizar.outputs.gravacao }}"
          --inicio "${{ needs.atualizar.outputs.inicio }}"
      - name: Sinal de vida externo (opcional)
        if: ${{ env.HEALTHCHECK_URL != '' }}
        run: |
          if [ "${{ needs.atualizar.result }}" = "success" ]; then
            curl -fsS -m 15 --retry 3 -o /dev/null "$HEALTHCHECK_URL"
          else
            curl -fsS -m 15 --retry 3 -o /dev/null "$HEALTHCHECK_URL/fail"
          fi
