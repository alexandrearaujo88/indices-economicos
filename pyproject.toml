[project]
name = "indices-daggtic"
version = "1.0.0"
description = "Coleta automatizada, armazenamento JSON e cálculo de IPCA, ICTI e IST"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "openpyxl>=3.1", "xlrd>=2.0.1", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.40"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
